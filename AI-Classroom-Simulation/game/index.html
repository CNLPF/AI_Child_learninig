  const mascot = new Image();
  let mascotReady = false;
  mascot.onload = function () { mascotReady = true; };
  mascot.onerror = function () { mascotReady = false; };
  mascot.src = MASCOT_URI;

  // ===== 运行时状态 =====
  let coins = [];
  let player;
  let cam = { x: 0 };
  let keys = { left: false, right: false, jump: false };
  let jumpBuffer = 0;
  let jumpHeld = false;
  let collected = 0;
  let state = 'play';   // 'play' | 'win'
  let respawnFlash = 0;
  let elapsed = 0;
  let winLock = 0;      // 通关后的输入锁定期（帧）：防止"按住方向键冲线"的残留重复事件立刻重开

  // ===== 怪物与能力状态 =====
  let enemies = [];
  let stomped = 0;          // 累计踩死怪物数
  let powerLevel = 0;       // 0=普通  1=强化（踩死怪物获得的奖励，可叠加至高亮状态）
  let hurtInvuln = 0;       // 受伤无敌帧（帧数）
  let hurtStun = 0;         // 受伤硬直：期间不能踩死怪物（防止奖励被刷回去）
  let popups = [];          // 飘字提示（+1、被击中）

  function resetLevel() {
    coins = coinSeeds.map(function (c) {
      return { x: c.x, y: c.y, r: 11, taken: false };
    });
    enemies = ENEMY_SEEDS.map(function (e) {
      return {
        x: e.x, y: e.y, w: ENEMY_W, h: ENEMY_H,
        vx: e.speed, face: 1,
        originX: e.x, patrol: e.patrol, speed: e.speed,
        alive: true, squash: 0        // squash>0 表示被踩扁后的残留动画帧
      };
    });
    player = {
      x: SPAWN.x, y: SPAWN.y, w: 32, h: 44,
      vx: 0, vy: 0, onGround: false, face: 1, anim: 0
    };
    cam.x = 0;
    collected = 0;
    stomped = 0;
    powerLevel = 0;
    hurtInvuln = 0;
    hurtStun = 0;
    popups = [];
    state = 'play';
    respawnFlash = 0;
    elapsed = 0;
    winLock = 0;
  }

  function respawn() {
    player.x = SPAWN.x;
    player.y = SPAWN.y;
    player.vx = 0;
    player.vy = 0;
    hurtInvuln = 60;      // 重生后给 1 秒无敌，避免一落地就被怪撞
    respawnFlash = 30;
  }

  // 飘字
  function addPopup(x, y, text, color) {
    popups.push({ x: x, y: y, text: text, color: color || '#fff', life: 60, vy: -1.1 });
  }

  // ===== 输入 =====
  // 【为什么这里写了两套判断】
  // 第一版用 e.key === 'r' → 中文输入法激活时 e.key 变成 'Process'，失效。
  // 第二版改成 e.code === 'KeyR' → 实测仍有输入法组合会让 e.code 变成空字符串，还是失效。
  // 所以现在三重兜底：
  //   ① e.code === 'KeyR'        正常情况
  //   ② e.keyCode === 82         老式键码，输入法通常不改它
  //   ③ e.key 小写后等于 'r'     无输入法时
  // 只要任一条件成立就重开。另外画布还支持"点击重开"，完全绕开键盘。

  function isKey(e, codeName, vk) {
    if (e.code === codeName) return true;
    if (e.keyCode === vk) return true;
    return false;
  }

  function wantsRestart(e) {
    if (e.code === 'KeyR') return true;
    if (e.keyCode === 82) return true;
    if (typeof e.key === 'string' && e.key.toLowerCase() === 'r') return true;
    return false;
  }

  // 【判定"这是不是游戏操作键"】
  // 通关瞬间玩家往往还按着方向键/空格。这类键不能当作"任意键继续"，
  // 否则成绩画面一闪就被重开，根本来不及看。
  const GAME_KEYS = {
    ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1,
    Space: 1, KeyA: 1, KeyD: 1, KeyW: 1, KeyS: 1
  };
  const GAME_VK = { 37: 1, 38: 1, 39: 1, 40: 1, 32: 1, 65: 1, 68: 1, 87: 1, 83: 1 };

  function isGameplayKey(e) {
    if (e.code && GAME_KEYS[e.code]) return true;
    if (e.keyCode && GAME_VK[e.keyCode]) return true;
    return false;
  }

  document.addEventListener('keydown', function (e) {
    // 【最关键的一层：通关界面上，按 R 或"任意非操作键"都算继续】
    // 原因：输入法彻底接管按键时，浏览器会给出 code=''、key='Process'、keyCode=229，
    // 页面根本无从得知用户按的是哪个键。此时任何"精确匹配 R"的判断都不可能成立。
    // 所以放宽：只要不是方向键/跳跃键，就当作"玩家想继续"。
    if (state === 'win') {
      // 排除三类"假按键"，否则会误触：
      //   ① e.repeat === true        按住键时的自动重复
      //   ② winLock > 0              刚到终点的那一小段时间
      //   ③ 方向键 / 跳跃键          玩家冲线时还按着的键
      if (!e.repeat && winLock <= 0 && !isGameplayKey(e)) {
        e.preventDefault();
        resetLevel();
      }
      return;
    }

    // 游戏中：只有 R 才重开（避免误触），三重判断兜底
    if (wantsRestart(e)) { e.preventDefault(); resetLevel(); return; }

    if (isKey(e, 'ArrowLeft', 37) || isKey(e, 'KeyA', 65)) { keys.left = true; e.preventDefault(); }
    if (isKey(e, 'ArrowRight', 39) || isKey(e, 'KeyD', 68)) { keys.right = true; e.preventDefault(); }
    if (isKey(e, 'ArrowUp', 38) || isKey(e, 'KeyW', 87) || isKey(e, 'Space', 32)) {
      keys.jump = true;
      if (!jumpHeld) { jumpBuffer = 8; jumpHeld = true; }
      e.preventDefault();
    }
  });

  document.addEventListener('keyup', function (e) {
    if (isKey(e, 'ArrowLeft', 37) || isKey(e, 'KeyA', 65)) keys.left = false;
    if (isKey(e, 'ArrowRight', 39) || isKey(e, 'KeyD', 68)) keys.right = false;
    if (isKey(e, 'ArrowUp', 38) || isKey(e, 'KeyW', 87) || isKey(e, 'Space', 32)) {
      keys.jump = false;
      jumpHeld = false;
    }
  });

  // 【兜底入口：鼠标/触摸】
  // 键盘在某些环境下拿不到（浏览器扩展抢占、输入法深度接管、焦点在画布外等）。
  // 所以让画布本身也能重开：仅在通关画面下生效，避免游戏中误点打断。
  // 这条路径完全不经过键盘事件。
  function clickRestart(e) {
    if (state === 'win' && winLock <= 0) {
      e.preventDefault();
      resetLevel();
    }
  }
  canvas.addEventListener('mousedown', clickRestart);
  canvas.addEventListener('touchstart', clickRestart, { passive: false });

  // 【iframe / 预览面板里的焦点问题】
  // 本文件经常被嵌在预览面板的 iframe 里打开。iframe 未获得焦点时，
  // 键盘事件根本不会进到这个 document，R 键看上去就"完全没反应"。
  // 对策：加载即主动抢焦点；鼠标进入画布或点击时再抢一次。
  canvas.focus();
  window.focus();
  canvas.addEventListener('mouseenter', function () { canvas.focus(); });
  canvas.addEventListener('mousedown', function () { canvas.focus(); });

  // 失焦时清空按键，避免"按键卡住"导致角色一直跑
  window.addEventListener('blur', function () {
    keys.left = false; keys.right = false; keys.jump = false; jumpHeld = false;
  });

  // ===== 工具 =====
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ===== 更新 =====
  function updatePhysics() {
    // winLock 必须在"提前返回"之前递减，否则通关后它永远是正数，锁死解不开
    if (winLock > 0) winLock--;
    if (state === 'win') return;
    elapsed += 1 / 60;

    // 水平输入
    let dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;

    if (dir !== 0) {
      player.vx += dir * MOVE_ACC;
      player.face = dir;
    } else {
      player.vx *= FRICTION;
      if (Math.abs(player.vx) < 0.06) player.vx = 0;
    }
    player.vx = clamp(player.vx, -MAX_SPEED, MAX_SPEED);

    // 跳跃（带输入缓冲，落地前按也能触发）
    if (jumpBuffer > 0) {
      if (player.onGround) {
        player.vy = JUMP_V;
        player.onGround = false;
        jumpBuffer = 0;
      } else {
        jumpBuffer--;
      }
    }

    // 重力
    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    // --- 水平移动与碰撞 ---
    player.x += player.vx;
    for (let i = 0; i < solidBlocks.length; i++) {
      const b = solidBlocks[i];
      if (overlap(player, b)) {
        if (player.vx > 0) player.x = b.x - player.w;
        else if (player.vx < 0) player.x = b.x + b.w;
        player.vx = 0;
      }
    }

    // --- 垂直移动与碰撞 ---
    player.y += player.vy;
    player.onGround = false;
    for (let i = 0; i < solidBlocks.length; i++) {
      const b = solidBlocks[i];
      if (overlap(player, b)) {
        if (player.vy > 0) {
          player.y = b.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = b.y + b.h;
          player.vy = 0;
        }
      }
    }

    // 边界
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x + player.w > LEVEL_WIDTH) {
      player.x = LEVEL_WIDTH - player.w;
      player.vx = 0;
    }

    // 掉出世界
    if (player.y > H + 160) respawn();

    // 走路动画
    if (player.onGround && Math.abs(player.vx) > 0.4) {
      player.anim += Math.abs(player.vx) * 0.22;
    } else {
      player.anim = 0;
    }

    // 收集金币
    const pc = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.taken) continue;
      const cb = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (overlap(pc, cb)) { c.taken = true; collected++; }
    }

    // 到达终点
    if (overlap(player, GOAL)) {
      state = 'win';
      winLock = 45;             // 锁 45 帧（约 0.75 秒）：玩家还在按方向键，别立刻重开
    }

    if (respawnFlash > 0) respawnFlash--;
    updateEnemies();
    updatePopups();
  }

  // ===== 怪物更新 =====
  function updateEnemies() {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];

      // 被踩扁的残留动画
      if (e.squash > 0) {
        e.squash--;
        if (e.squash === 0) e.alive = false;
        continue;
      }
      if (!e.alive) continue;

      // 巡逻移动
      e.x += e.vx;
      e.face = e.vx > 0 ? 1 : -1;

      // 到达巡逻边界 → 掉头
      if (e.x < e.originX - e.patrol) {
        e.x = e.originX - e.patrol;
        e.vx = Math.abs(e.vx);
      } else if (e.x + e.w > e.originX + e.patrol + e.w) {
        e.x = e.originX + e.patrol;
        e.vx = -Math.abs(e.vx);
      }

      // 撞到关卡片段墙壁则掉头（简单处理：遇到实心块侧面就反向）
      for (let b = 0; b < solidBlocks.length; b++) {
        const blk = solidBlocks[b];
        if (overlap(e, blk)) {
          // 从块的哪一侧来的，就退回去
          if (e.vx > 0) e.x = blk.x - e.w;
          else e.x = blk.x + blk.w;
          e.vx = -e.vx;
          break;
        }
      }

      // 与玩家判定
      if (overlap(player, e)) {
        const playerBottomPrev = player.y + player.h - player.vy;

        // 判定"踩中"：玩家在下落，且上一帧脚底还在怪物上半部之上
        // hurtStun > 0 时（受伤硬直）不允许踩死，防止"被撞飞→落到怪头上→又把能力加回来"
        const isStomping = hurtStun <= 0 &&
                           player.vy > STOMP_MIN_VY &&
                           playerBottomPrev <= e.y + e.h * 0.6;

        if (isStomping) {
          // 踩死：怪物进入压扁动画，玩家弹起
          e.squash = 22;
          player.vy = STOMP_BOUNCE;
          player.onGround = false;
          stomped++;

          // ===== 奖励：踩死怪物获得能力强化 =====
          powerLevel = Math.min(powerLevel + 1, 3);
          addPopup(e.x + e.w / 2, e.y - 10, '能力 +1', '#ffd93b');
        } else if (hurtInvuln <= 0) {
          // 侧碰受伤：扣能力等级，无能力则弹回起点
          if (powerLevel > 0) {
            powerLevel--;
            hurtInvuln = 70;
            hurtStun = 20;          // 受伤硬直：期间不能踩死怪物，防止"被撞飞→落到怪头上→又加回来"
            // 击退：向后 + 轻微向下，避免玩家弹到怪物头顶
            const dir = player.x + player.w / 2 < e.x + e.w / 2 ? -1 : 1;
            player.vx = dir * 7;
            player.vy = -4.2;
            player.onGround = false;
            addPopup(player.x + player.w / 2, player.y - 8, '能力 -1', '#ff8a65');
          } else {
            respawn();
            addPopup(e.x + e.w / 2, e.y - 10, '被击中了！', '#ff5252');
          }
        }
      }
    }
  }

  function updatePopups() {
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) popups.splice(i, 1);
    }
    if (hurtInvuln > 0) hurtInvuln--;
    if (hurtStun > 0) hurtStun--;
  }

  function updateCamera() {
    const target = player.x + player.w / 2 - W * 0.42;
    cam.x += (clamp(target, 0, LEVEL_WIDTH - W) - cam.x) * 0.12;
    cam.x = clamp(cam.x, 0, LEVEL_WIDTH - W);
  }

  // ===== 绘制 =====
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8fd3ff');
    g.addColorStop(0.55, '#c9e9ff');
    g.addColorStop(1, '#eaf7ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawClouds() {
    const offset = cam.x * 0.25;
    const clouds = [
      { x: 120,  y: 90,  s: 1.0 },
      { x: 480,  y: 60,  s: 0.75 },
      { x: 820,  y: 120, s: 1.15 },
      { x: 1300, y: 70,  s: 0.9 },
      { x: 1800, y: 110, s: 1.05 },
      { x: 2300, y: 65,  s: 0.8 }
    ];
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      const x = c.x - offset;
      if (x < -250 || x > W + 250) continue;
      const s = c.s;
      ctx.beginPath();
      ctx.arc(x, c.y, 26 * s, 0, Math.PI * 2);
      ctx.arc(x + 30 * s, c.y - 12 * s, 32 * s, 0, Math.PI * 2);
      ctx.arc(x + 66 * s, c.y, 24 * s, 0, Math.PI * 2);
      ctx.arc(x + 34 * s, c.y + 10 * s, 28 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHills() {
    const offset = cam.x * 0.45;
    ctx.fillStyle = '#a8e6a3';
    for (let i = -1; i < 7; i++) {
      const bx = i * 520 - (offset % 520);
      ctx.beginPath();
      ctx.arc(bx + 180, 470, 210, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = '#8ed489';
    for (let i = -1; i < 8; i++) {
      const bx = i * 380 - ((offset * 1.4) % 380);
      ctx.beginPath();
      ctx.arc(bx + 120, 490, 150, Math.PI, 0);
      ctx.fill();
    }
  }

  function drawBlocks() {
    for (let i = 0; i < solidBlocks.length; i++) {
      const b = solidBlocks[i];
      const sx = b.x - cam.x;
      if (sx + b.w < -40 || sx > W + 40) continue;

      if (b.type === 'ground') {
        ctx.fillStyle = '#7b4b2a';
        ctx.fillRect(sx, b.y, b.w, b.h);
        ctx.fillStyle = '#5f381d';
        for (let gx = 0; gx < b.w; gx += 40) {
          for (let gy = 0; gy < b.h; gy += 40) {
            if (((gx / 40) + (gy / 40)) % 2 === 0) {
              ctx.fillRect(sx + gx + 2, b.y + gy + 2, 36, 36);
            }
          }
        }
        // 草皮
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(sx, b.y, b.w, 14);
        ctx.fillStyle = '#66d16a';
        ctx.fillRect(sx, b.y, b.w, 6);
      } else {
        // 空中砖块
        ctx.fillStyle = '#c98b4b';
        ctx.fillRect(sx, b.y, b.w, b.h);
        ctx.fillStyle = '#a8703a';
        ctx.fillRect(sx, b.y + b.h - 8, b.w, 8);
        ctx.fillStyle = '#e0a869';
        ctx.fillRect(sx, b.y, b.w, 5);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        for (let gx = 30; gx < b.w; gx += 30) {
          ctx.beginPath();
          ctx.moveTo(sx + gx + 0.5, b.y + 2);
          ctx.lineTo(sx + gx + 0.5, b.y + b.h - 2);
          ctx.stroke();
        }
      }
    }
  }

  function drawCoins(t) {
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.taken) continue;
      const sx = c.x - cam.x;
      if (sx < -40 || sx > W + 40) continue;

      const bob = Math.sin(t * 3 + i * 0.6) * 3;
      const squash = Math.abs(Math.cos(t * 3 + i * 0.6));
      const rx = Math.max(2.5, c.r * squash);

      ctx.save();
      ctx.translate(sx, c.y + bob);
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, c.r, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd93b';
      ctx.fill();
      ctx.strokeStyle = '#e0a800';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      if (squash > 0.45) {
        ctx.beginPath();
        ctx.ellipse(0, 0, rx * 0.22, c.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff3a8';
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ===== 怪物绘制 =====
  // 造型：紫色小怪，有眼睛和尖牙，踩中时压扁。
  function drawEnemies(t) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive && e.squash === 0) continue;
      const sx = e.x - cam.x;
      if (sx + e.w < -60 || sx > W + 60) continue;

      const isSquashed = e.squash > 0;
      // 压扁比例：从 1 压到 0.32
      const sq = isSquashed ? 0.32 + (e.squash / 22) * 0.68 : 1;
      const drawH = e.h * sq;
      const drawY = e.y + e.h - drawH;

      ctx.save();
      // 影子
      ctx.beginPath();
      ctx.ellipse(sx + e.w / 2, e.y + e.h, e.w * 0.42, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fill();

      // 走路摇摆
      const wobble = isSquashed ? 0 : Math.sin(t * 8 + i) * 1.4;

      // 身体（圆角矩形 + 底部两脚）
      ctx.fillStyle = '#8e5bd4';
      roundRect(ctx, sx, drawY + wobble, e.w, drawH, 9);
      ctx.fill();
      // 高光
      ctx.fillStyle = '#a974e8';
      roundRect(ctx, sx + 3, drawY + 3 + wobble, e.w - 6, drawH * 0.45, 7);
      ctx.fill();

      if (!isSquashed) {
        // 脚
        ctx.fillStyle = '#6d3fb0';
        const step = Math.sin(t * 8 + i) * 2.5;
        ctx.beginPath();
        ctx.ellipse(sx + 9, e.y + e.h - 1 + step, 7, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(sx + e.w - 9, e.y + e.h - 1 - step, 7, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 眼睛（朝向跟随移动方向）
        const eyeOff = e.face * 2;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sx + e.w / 2 - 7 + eyeOff, drawY + drawH * 0.38 + wobble, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx + e.w / 2 + 7 + eyeOff, drawY + drawH * 0.38 + wobble, 5.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2a1840';
        ctx.beginPath();
        ctx.arc(sx + e.w / 2 - 7 + eyeOff * 1.6, drawY + drawH * 0.38 + wobble, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx + e.w / 2 + 7 + eyeOff * 1.6, drawY + drawH * 0.38 + wobble, 3, 0, Math.PI * 2);
        ctx.fill();

        // 尖牙嘴
        ctx.fillStyle = '#2a1840';
        ctx.beginPath();
        ctx.ellipse(sx + e.w / 2, drawY + drawH * 0.68 + wobble, 7, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(sx + e.w / 2 - 5, drawY + drawH * 0.66 + wobble);
        ctx.lineTo(sx + e.w / 2 - 2.5, drawY + drawH * 0.78 + wobble);
        ctx.lineTo(sx + e.w / 2, drawY + drawH * 0.66 + wobble);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + e.w / 2 + 1, drawY + drawH * 0.66 + wobble);
        ctx.lineTo(sx + e.w / 2 + 3.5, drawY + drawH * 0.78 + wobble);
        ctx.lineTo(sx + e.w / 2 + 5, drawY + drawH * 0.66 + wobble);
        ctx.closePath();
        ctx.fill();
      } else {
        // 被踩扁：X 形眼睛
        ctx.strokeStyle = '#2a1840';
        ctx.lineWidth = 2;
        const ey = drawY + drawH * 0.5;
        [-8, 8].forEach(function (dx) {
          ctx.beginPath();
          ctx.moveTo(sx + e.w / 2 + dx - 3, ey - 3);
          ctx.lineTo(sx + e.w / 2 + dx + 3, ey + 3);
          ctx.moveTo(sx + e.w / 2 + dx + 3, ey - 3);
          ctx.lineTo(sx + e.w / 2 + dx - 3, ey + 3);
          ctx.stroke();
        });
      }
      ctx.restore();
    }
  }

  function drawPopups() {
    for (let i = 0; i < popups.length; i++) {
      const p = popups[i];
      const a = Math.min(1, p.life / 30);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillText(p.text, p.x - cam.x + 1, p.y + 1);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x - cam.x, p.y);
      ctx.restore();
    }
    ctx.textAlign = 'left';
  }

  function drawGoal(t) {
    const sx = GOAL.x - cam.x;
    if (sx < -80 || sx > W + 80) return;

    // 旗杆
    ctx.fillStyle = '#cfd8dc';
    ctx.fillRect(sx + 8, GOAL.y, 8, GOAL.h);
    ctx.fillStyle = '#90a4ae';
    ctx.fillRect(sx + 8, GOAL.y, 3, GOAL.h);
    // 底座
    ctx.fillStyle = '#78909c';
    ctx.fillRect(sx - 6, GOAL.y + GOAL.h - 10, 34, 10);

    // 旗子（飘动）
    const wave = Math.sin(t * 4) * 4;
    ctx.beginPath();
    ctx.moveTo(sx + 16, GOAL.y + 6);
    ctx.quadraticCurveTo(sx + 56 + wave, GOAL.y + 22, sx + 16, GOAL.y + 46);
    ctx.closePath();
    ctx.fillStyle = '#ef5350';
    ctx.fill();
    ctx.strokeStyle = '#c62828';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawPlayer() {
    const sx = player.x - cam.x;
    const sy = player.y;

    // 走路时的上下颠簸（视觉增强，不影响物理判定盒）
    const bob = player.onGround && Math.abs(player.vx) > 0.4
      ? Math.sin(player.anim) * 1.6
      : 0;

    // 影子（始终绘制，贴地）
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(sx + player.w / 2, sy + player.h + 1, 16, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fill();
    ctx.restore();

    if (mascotReady) {
      drawPlayerSprite(sx, sy, bob);
    } else {
      drawPlayerFallback(sx, sy, bob);
    }
  }

  // 绘制吉祥物精灵图
  // 精灵原始宽高比 220:200 = 1.1；物理判定盒 32x44，视觉上略放大以突出角色
  function drawPlayerSprite(sx, sy, bob) {
    const SPRITE_W = 48;                       // 视觉宽度（判定盒为 32，视觉略宽以显饱满）
    const SPRITE_H = SPRITE_W * (mascot.height / mascot.width);
    const cx = sx + player.w / 2;              // 以判定盒中心为锚点
    const feetY = sy + player.h;               // 脚底对齐判定盒底边

    ctx.save();
    // 朝向：面朝左时水平翻转（原图朝右）
    ctx.translate(cx, feetY + bob);
    if (player.face < 0) ctx.scale(-1, 1);

    // 空中时轻微倾斜，增强跳跃手感
    if (!player.onGround) {
      const tilt = clamp(player.vy * 0.018, -0.22, 0.26);
      ctx.rotate(tilt * (player.face < 0 ? -1 : 1));
    }

    // 受伤无敌帧：半透明闪烁
    if (hurtInvuln > 0 && Math.floor(hurtInvuln / 4) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    }

    // 能力强化光环（powerLevel 越高越明显）
    if (powerLevel > 0) {
      const glowR = 26 + powerLevel * 4;
      const grd = ctx.createRadialGradient(0, -SPRITE_H * 0.5, 4, 0, -SPRITE_H * 0.5, glowR);
      grd.addColorStop(0, 'rgba(255,217,59,' + (0.20 + powerLevel * 0.08) + ')');
      grd.addColorStop(1, 'rgba(255,217,59,0)');
      ctx.beginPath();
      ctx.arc(0, -SPRITE_H * 0.5, glowR, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
    }

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(mascot, -SPRITE_W / 2, -SPRITE_H, SPRITE_W, SPRITE_H);
    ctx.restore();
  }

  // 兜底：精灵图加载失败时用代码画一只简易小绿龙，保证游戏始终可玩
  function drawPlayerFallback(sx, sy, bob) {
    ctx.save();
    ctx.translate(sx + player.w / 2, sy + player.h);
    ctx.scale(player.face, 1);

    // 尾巴
    ctx.fillStyle = '#8ab63a';
    ctx.beginPath();
    ctx.moveTo(-12, -14 + bob);
    ctx.quadraticCurveTo(-30, -10 + bob, -26, -26 + bob);
    ctx.quadraticCurveTo(-20, -16 + bob, -12, -20 + bob);
    ctx.closePath();
    ctx.fill();

    // 腿
    const legSwing = player.onGround ? Math.sin(player.anim) * 3 : 2;
    ctx.fillStyle = '#6f9b2c';
    ctx.fillRect(-11, -12, 8, 12 + legSwing);
    ctx.fillRect(3, -12, 8, 12 - legSwing);

    // 身体
    ctx.fillStyle = '#a0c840';
    roundRect(ctx, -13, -36 + bob, 26, 26, 9);
    ctx.fill();

    // 肚皮
    ctx.fillStyle = '#e8d878';
    roundRect(ctx, -6, -28 + bob, 14, 16, 7);
    ctx.fill();

    // 头
    ctx.fillStyle = '#b0d048';
    roundRect(ctx, -11, -54 + bob, 26, 21, 8);
    ctx.fill();

    // 背刺
    ctx.fillStyle = '#7fae2f';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-10 + i * 7, -52 + bob);
      ctx.lineTo(-7 + i * 7, -59 + bob);
      ctx.lineTo(-4 + i * 7, -52 + bob);
      ctx.closePath();
      ctx.fill();
    }

    // 眼睛
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(5, -46 + bob, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#20303a';
    ctx.beginPath();
    ctx.arc(6.5, -46 + bob, 2.6, 0, Math.PI * 2);
    ctx.fill();

    // 嘴
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(3, -39 + bob, 4, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function drawHUD() {
    // 金币计数
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(ctx, 18, 18, 168, 48, 12);
    ctx.fill();

    // 金币图标
    ctx.beginPath();
    ctx.arc(46, 42, 12, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd93b';
    ctx.fill();
    ctx.strokeStyle = '#e0a800';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(collected + ' / ' + coins.length, 70, 43);
    ctx.restore();

    // 能力等级面板
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(ctx, 18, 76, 168, 48, 12);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('能力', 32, 100);
    // 三格能量条
    for (let i = 0; i < 3; i++) {
      const bx = 72 + i * 36, by = 90;
      ctx.beginPath();
      roundRect(ctx, bx, by, 30, 20, 5);
      if (i < powerLevel) {
        ctx.fillStyle = '#ffd93b';
        ctx.fill();
        ctx.strokeStyle = '#e0a800';
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      }
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // 踩怪计数
    ctx.fillStyle = '#b0bec5';
    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('踩扁 ' + stomped, 32, 112);
    ctx.restore();

    // 操作提示
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(ctx, W - 316, 18, 298, 48, 12);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('← → 移动   空格 跳跃   R 重来', W - 298, 43);
    ctx.restore();

    // 掉坑闪红
    if (respawnFlash > 0) {
      ctx.fillStyle = 'rgba(255,80,80,' + (respawnFlash / 30 * 0.28) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 受伤无敌帧：角色闪烁（半透明白罩提示）
    if (hurtInvuln > 0 && Math.floor(hurtInvuln / 4) % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawWin(t) {
    ctx.fillStyle = 'rgba(10,20,40,0.78)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd93b';
    ctx.font = 'bold 64px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('通关啦！', W / 2, H / 2 - 60);

    ctx.fillStyle = '#ffffff';
    ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('收集金币 ' + collected + ' / ' + coins.length, W / 2, H / 2 + 4);
    ctx.fillText('踩扁怪物 ' + stomped + ' 只', W / 2, H / 2 + 42);

    ctx.font = '22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#81c784';
    ctx.fillText('用时 ' + elapsed.toFixed(1) + ' 秒', W / 2, H / 2 + 86);

    // 重开按钮（做成明显的按钮样式，避免玩家以为没反应）
    const bw = 340, bh = 56, bx = W / 2 - bw / 2, by = H / 2 + 116;
    const locked = winLock > 0;
    const pulse = 0.5 + Math.sin(t * 4) * 0.5;

    ctx.beginPath();
    roundRect(ctx, bx, by, bw, bh, 14);
    if (locked) {
      // 锁定期：暗色，明确告诉玩家"马上就能点"
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    } else {
      ctx.fillStyle = 'rgba(255,217,59,' + (0.15 + pulse * 0.2) + ')';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,217,59,' + (0.6 + pulse * 0.4) + ')';
    }
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = locked ? 'rgba(255,255,255,0.45)' : '#ffd93b';
    ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(locked ? '稍等一下下…' : '按任意键 或 点这里 重新挑战', W / 2, by + bh / 2 + 1);

    // 键盘万一失效的说明
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('（键盘没反应时，直接用鼠标点上面的按钮）', W / 2, by + bh + 34);

    ctx.textAlign = 'left';
  }

  // ===== 主循环（固定步长累加器） =====
  let last = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;
  let clock = 0;

  function loop(now) {
    let delta = now - last;
    last = now;
    if (delta > 250) delta = 250;   // 切标签页回来不要瞬移
    acc += delta;
    clock += delta / 1000;

    let guard = 0;
    while (acc >= STEP && guard < 5) {
      updatePhysics();
      acc -= STEP;
      guard++;
    }
    if (guard >= 5) acc = 0;

    updateCamera();

    // 渲染
    drawSky();
    drawClouds();
    drawHills();
    drawGoal(clock);
    drawBlocks();
    drawCoins(clock);
    drawEnemies(clock);
    drawPlayer();
    drawPopups();
    drawHUD();
    if (state === 'win') drawWin(clock);

    requestAnimationFrame(loop);
  }

  resetLevel();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
