<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小恐龙闯关 · 最小可执行原型 V1</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    border-radius: 12px;
    overflow: hidden;
    line-height: 0;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ===== 物理参数 =====
  const GRAVITY = 0.62;
  const JUMP_V = -12.4;
  const MOVE_ACC = 0.9;
  const MAX_SPEED = 5.2;
  const FRICTION = 0.82;
  const MAX_FALL = 16;

  // ===== 关卡数据 =====
  const LEVEL_WIDTH = 3200;

  const solidBlocks = [
    // 地面（中间留一个坑）
    { x: 0,    y: 460, w: 900,  h: 80, type: 'ground' },
    { x: 1020, y: 460, w: 1300, h: 80, type: 'ground' },
    { x: 2320, y: 460, w: 880,  h: 80, type: 'ground' },

    // 空中平台
    { x: 300,  y: 360, w: 160, h: 24, type: 'plat' },
    { x: 520,  y: 290, w: 140, h: 24, type: 'plat' },
    { x: 760,  y: 340, w: 120, h: 24, type: 'plat' },
    { x: 1150, y: 350, w: 180, h: 24, type: 'plat' },
    { x: 1400, y: 270, w: 150, h: 24, type: 'plat' },
    { x: 1650, y: 340, w: 160, h: 24, type: 'plat' },
    { x: 2000, y: 300, w: 180, h: 24, type: 'plat' },
    { x: 2450, y: 330, w: 160, h: 24, type: 'plat' },
    { x: 2700, y: 250, w: 150, h: 24, type: 'plat' }
  ];

  const coinSeeds = [
    { x: 180,  y: 420 }, { x: 250,  y: 420 },
    { x: 350,  y: 320 }, { x: 420,  y: 320 },
    { x: 570,  y: 250 }, { x: 620,  y: 250 },
    { x: 800,  y: 300 },
    { x: 960,  y: 400 },            // 坑上方的金币（跳过去才拿得到）
    { x: 1200, y: 310 }, { x: 1280, y: 310 },
    { x: 1450, y: 230 }, { x: 1510, y: 230 },
    { x: 1700, y: 300 }, { x: 1770, y: 300 },
    { x: 2060, y: 260 }, { x: 2130, y: 260 },
    { x: 2350, y: 420 }, { x: 2400, y: 420 },
    { x: 2500, y: 290 }, { x: 2570, y: 290 },
    { x: 2750, y: 210 }, { x: 2810, y: 210 }
  ];

  const GOAL = { x: 3040, y: 340, w: 26, h: 120 };

  const SPAWN = { x: 80, y: 360 };

  // ===== 运行时状态 =====
  let coins = [];
  let player;
  let cam = { x: 0 };
  let keys = { left: false, right: false, jump: false };
  let jumpBuffer = 0;
  let jumpHeld = false;
  let collected = 0;
  let state = 'play';   // 'play' | 'win'
  let respawnFlash = 0;
  let elapsed = 0;

  function resetLevel() {
    coins = coinSeeds.map(function (c) {
      return { x: c.x, y: c.y, r: 11, taken: false };
    });
    player = {
      x: SPAWN.x, y: SPAWN.y, w: 32, h: 44,
      vx: 0, vy: 0, onGround: false, face: 1, anim: 0
    };
    cam.x = 0;
    collected = 0;
    state = 'play';
    respawnFlash = 0;
    elapsed = 0;
  }

  function respawn() {
    player.x = SPAWN.x;
    player.y = SPAWN.y;
    player.vx = 0;
    player.vy = 0;
    respawnFlash = 30;
  }

  // ===== 输入 =====
  document.addEventListener('keydown', function (e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') {
      keys.jump = true;
      if (!jumpHeld) { jumpBuffer = 8; jumpHeld = true; }
      e.preventDefault();
    }
    if (k === 'r' || k === 'R') { resetLevel(); }
  });

  document.addEventListener('keyup', function (e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
    if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') {
      keys.jump = false;
      jumpHeld = false;
    }
  });

  // ===== 工具 =====
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ===== 更新 =====
  function updatePhysics() {
    if (state === 'win') return;
    elapsed += 1 / 60;

    // 水平输入
    let dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;

    if (dir !== 0) {
      player.vx += dir * MOVE_ACC;
      player.face = dir;
    } else {
      player.vx *= FRICTION;
      if (Math.abs(player.vx) < 0.06) player.vx = 0;
    }
    player.vx = clamp(player.vx, -MAX_SPEED, MAX_SPEED);

    // 跳跃（带输入缓冲，落地前按也能触发）
    if (jumpBuffer > 0) {
      if (player.onGround) {
        player.vy = JUMP_V;
        player.onGround = false;
        jumpBuffer = 0;
      } else {
        jumpBuffer--;
      }
    }

    // 重力
    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    // --- 水平移动与碰撞 ---
    player.x += player.vx;
    for (let i = 0; i < solidBlocks.length; i++) {
      const b = solidBlocks[i];
      if (overlap(player, b)) {
        if (player.vx > 0) player.x = b.x - player.w;
        else if (player.vx < 0) player.x = b.x + b.w;
        player.vx = 0;
      }
    }

    // --- 垂直移动与碰撞 ---
    player.y += player.vy;
    player.onGround = false;
    for (let i = 0; i < solidBlocks.length; i++) {
      const b = solidBlocks[i];
      if (overlap(player, b)) {
        if (player.vy > 0) {
          player.y = b.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = b.y + b.h;
          player.vy = 0;
        }
      }
    }

    // 边界
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x + player.w > LEVEL_WIDTH) {
      player.x = LEVEL_WIDTH - player.w;
      player.vx = 0;
    }

    // 掉出世界
    if (player.y > H + 160) respawn();

    // 走路动画
    if (player.onGround && Math.abs(player.vx) > 0.4) {
      player.anim += Math.abs(player.vx) * 0.22;
    } else {
      player.anim = 0;
    }

    // 收集金币
    const pc = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.taken) continue;
      const cb = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (overlap(pc, cb)) { c.taken = true; collected++; }
    }

    // 到达终点
    if (overlap(player, GOAL)) { state = 'win'; }

    if (respawnFlash > 0) respawnFlash--;
  }

  function updateCamera() {
    const target = player.x + player.w / 2 - W * 0.42;
    cam.x += (clamp(target, 0, LEVEL_WIDTH - W) - cam.x) * 0.12;
    cam.x = clamp(cam.x, 0, LEVEL_WIDTH - W);
  }

  // ===== 绘制 =====
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8fd3ff');
    g.addColorStop(0.55, '#c9e9ff');
    g.addColorStop(1, '#eaf7ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawClouds() {
    const offset = cam.x * 0.25;
    const clouds = [
      { x: 120,  y: 90,  s: 1.0 },
      { x: 480,  y: 60,  s: 0.75 },
      { x: 820,  y: 120, s: 1.15 },
      { x: 1300, y: 70,  s: 0.9 },
      { x: 1800, y: 110, s: 1.05 },
      { x: 2300, y: 65,  s: 0.8 }
    ];
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      const x = c.x - offset;
      if (x < -250 || x > W + 250) continue;
      const s = c.s;
      ctx.beginPath();
      ctx.arc(x, c.y, 26 * s, 0, Math.PI * 2);
      ctx.arc(x + 30 * s, c.y - 12 * s, 32 * s, 0, Math.PI * 2);
      ctx.arc(x + 66 * s, c.y, 24 * s, 0, Math.PI * 2);
      ctx.arc(x + 34 * s, c.y + 10 * s, 28 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHills() {
    const offset = cam.x * 0.45;
    ctx.fillStyle = '#a8e6a3';
    for (let i = -1; i < 7; i++) {
      const bx = i * 520 - (offset % 520);
      ctx.beginPath();
      ctx.arc(bx + 180, 470, 210, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = '#8ed489';
    for (let i = -1; i < 8; i++) {
      const bx = i * 380 - ((offset * 1.4) % 380);
      ctx.beginPath();
      ctx.arc(bx + 120, 490, 150, Math.PI, 0);
      ctx.fill();
    }
  }

  function drawBlocks() {
    for (let i = 0; i < solidBlocks.length; i++) {
      const b = solidBlocks[i];
      const sx = b.x - cam.x;
      if (sx + b.w < -40 || sx > W + 40) continue;

      if (b.type === 'ground') {
        ctx.fillStyle = '#7b4b2a';
        ctx.fillRect(sx, b.y, b.w, b.h);
        ctx.fillStyle = '#5f381d';
        for (let gx = 0; gx < b.w; gx += 40) {
          for (let gy = 0; gy < b.h; gy += 40) {
            if (((gx / 40) + (gy / 40)) % 2 === 0) {
              ctx.fillRect(sx + gx + 2, b.y + gy + 2, 36, 36);
            }
          }
        }
        // 草皮
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(sx, b.y, b.w, 14);
        ctx.fillStyle = '#66d16a';
        ctx.fillRect(sx, b.y, b.w, 6);
      } else {
        // 空中砖块
        ctx.fillStyle = '#c98b4b';
        ctx.fillRect(sx, b.y, b.w, b.h);
        ctx.fillStyle = '#a8703a';
        ctx.fillRect(sx, b.y + b.h - 8, b.w, 8);
        ctx.fillStyle = '#e0a869';
        ctx.fillRect(sx, b.y, b.w, 5);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        for (let gx = 30; gx < b.w; gx += 30) {
          ctx.beginPath();
          ctx.moveTo(sx + gx + 0.5, b.y + 2);
          ctx.lineTo(sx + gx + 0.5, b.y + b.h - 2);
          ctx.stroke();
        }
      }
    }
  }

  function drawCoins(t) {
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.taken) continue;
      const sx = c.x - cam.x;
      if (sx < -40 || sx > W + 40) continue;

      const bob = Math.sin(t * 3 + i * 0.6) * 3;
      const squash = Math.abs(Math.cos(t * 3 + i * 0.6));
      const rx = Math.max(2.5, c.r * squash);

      ctx.save();
      ctx.translate(sx, c.y + bob);
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, c.r, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd93b';
      ctx.fill();
      ctx.strokeStyle = '#e0a800';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      if (squash > 0.45) {
        ctx.beginPath();
        ctx.ellipse(0, 0, rx * 0.22, c.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff3a8';
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawGoal(t) {
    const sx = GOAL.x - cam.x;
    if (sx < -80 || sx > W + 80) return;

    // 旗杆
    ctx.fillStyle = '#cfd8dc';
    ctx.fillRect(sx + 8, GOAL.y, 8, GOAL.h);
    ctx.fillStyle = '#90a4ae';
    ctx.fillRect(sx + 8, GOAL.y, 3, GOAL.h);
    // 底座
    ctx.fillStyle = '#78909c';
    ctx.fillRect(sx - 6, GOAL.y + GOAL.h - 10, 34, 10);

    // 旗子（飘动）
    const wave = Math.sin(t * 4) * 4;
    ctx.beginPath();
    ctx.moveTo(sx + 16, GOAL.y + 6);
    ctx.quadraticCurveTo(sx + 56 + wave, GOAL.y + 22, sx + 16, GOAL.y + 46);
    ctx.closePath();
    ctx.fillStyle = '#ef5350';
    ctx.fill();
    ctx.strokeStyle = '#c62828';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawPlayer() {
    const sx = player.x - cam.x;
    const sy = player.y;

    ctx.save();
    ctx.translate(sx + player.w / 2, sy + player.h);
    ctx.scale(player.face, 1);

    const bob = player.onGround && Math.abs(player.vx) > 0.4
      ? Math.sin(player.anim) * 1.5
      : 0;

    // 影子
    ctx.beginPath();
    ctx.ellipse(0, 1, 15, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fill();

    // 腿
    ctx.fillStyle = '#3d5afe';
    const legSwing = player.onGround ? Math.sin(player.anim) * 5 : 3;
    ctx.fillRect(-11, -14, 8, 14 + legSwing * 0.2);
    ctx.fillRect(3, -14, 8, 14 - legSwing * 0.2);

    // 身体
    ctx.fillStyle = '#ff7043';
    roundRect(ctx, -14, -38 + bob, 28, 26, 7);
    ctx.fill();

    // 肚皮
    ctx.fillStyle = '#ffccbc';
    roundRect(ctx, -7, -30 + bob, 14, 15, 5);
    ctx.fill();

    // 头
    ctx.fillStyle = '#ff8a65';
    roundRect(ctx, -13, -56 + bob, 26, 22, 8);
    ctx.fill();

    // 眼睛
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(4, -46 + bob, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#263238';
    ctx.beginPath();
    ctx.arc(5.5, -46 + bob, 2.8, 0, Math.PI * 2);
    ctx.fill();

    // 嘴
    ctx.strokeStyle = '#bf360c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(2, -38 + bob, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    // 小角
    ctx.fillStyle = '#ffab91';
    ctx.beginPath();
    ctx.moveTo(-4, -56 + bob);
    ctx.lineTo(0, -64 + bob);
    ctx.lineTo(4, -56 + bob);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function drawHUD() {
    // 金币计数
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(ctx, 18, 18, 168, 48, 12);
    ctx.fill();

    // 金币图标
    ctx.beginPath();
    ctx.arc(46, 42, 12, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd93b';
    ctx.fill();
    ctx.strokeStyle = '#e0a800';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(collected + ' / ' + coins.length, 70, 43);
    ctx.restore();

    // 操作提示
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(ctx, W - 300, 18, 282, 48, 12);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('← → 移动   空格 跳跃   R 重来', W - 282, 43);
    ctx.restore();

    // 掉坑闪红
    if (respawnFlash > 0) {
      ctx.fillStyle = 'rgba(255,80,80,' + (respawnFlash / 30 * 0.28) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawWin(t) {
    ctx.fillStyle = 'rgba(10,20,40,0.72)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd93b';
    ctx.font = 'bold 64px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('通关啦！', W / 2, H / 2 - 40);

    ctx.fillStyle = '#ffffff';
    ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('收集金币 ' + collected + ' / ' + coins.length, W / 2, H / 2 + 24);
    ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#b0bec5';
    ctx.fillText('用时 ' + elapsed.toFixed(1) + ' 秒 · 按 R 重新挑战', W / 2, H / 2 + 70);

    ctx.textAlign = 'left';
  }

  // ===== 主循环（固定步长累加器） =====
  let last = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;
  let clock = 0;

  function loop(now) {
    let delta = now - last;
    last = now;
    if (delta > 250) delta = 250;   // 切标签页回来不要瞬移
    acc += delta;
    clock += delta / 1000;

    let guard = 0;
    while (acc >= STEP && guard < 5) {
      updatePhysics();
      acc -= STEP;
      guard++;
    }
    if (guard >= 5) acc = 0;

    updateCamera();

    // 渲染
    drawSky();
    drawClouds();
    drawHills();
    drawGoal(clock);
    drawBlocks();
    drawCoins(clock);
    drawPlayer();
    drawHUD();
    if (state === 'win') drawWin(clock);

    requestAnimationFrame(loop);
  }

  resetLevel();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
