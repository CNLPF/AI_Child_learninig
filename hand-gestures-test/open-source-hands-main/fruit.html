<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>流光果园 · 手势切片竞技场</title>
    <link rel="stylesheet" href="/src/fruit/style.css">
  </head>
  <body>
    <header>
      <div class="brand">
        <small>SUNSET SLICE / ARCADE 01</small>
        <h1>流光果园</h1>
      </div>
      <div class="hud">
        <span class="score">切片 <strong id="score">0</strong></span>
        <span class="lives">护盾 <strong id="lives">3</strong></span>
      </div>
    </header>

    <main>
      <section id="stage">
        <canvas id="game" aria-label="手势切水果游戏区域"></canvas>

        <div class="topline">
          <span id="status" role="status">等待开始</span>
          <span>伸出食指 · 挥动切割 · 避开炸弹</span>
          <div class="mode-switch" role="group" aria-label="控制模式">
            <button id="mode-camera" class="mode-button active" aria-pressed="true">手势控制</button>
            <button id="mode-mouse" class="mode-button" aria-pressed="false">鼠标控制</button>
          </div>
        </div>
        <div id="flow-meter" class="ready" aria-label="流光蓄能">
          <div class="flow-meta">
            <span id="flow-label">流光蓄能</span>
            <span id="flow-value">0%</span>
          </div>
          <div class="flow-track"><i id="flow-fill"></i></div>
        </div>

        <div id="welcome">
          <small>让手指成为刀锋</small>
          <h2>让刀锋切开暮色。</h2>
          <p>手掌朝向镜头，伸出食指移动。<br>保持动作小而准，切开水果，避开发光的炸弹。</p>
          <div class="camera-choice">
            <select id="device" aria-label="选择摄像头">
              <option value="">系统默认摄像头</option>
            </select>
            <button id="refresh" class="secondary">刷新设备</button>
          </div>
          <button id="camera">开启摄像头</button>
          <button id="mouse" class="secondary">鼠标 / 触屏试玩</button>
          <p class="privacy">视频仅在本机处理，不录制、不上传。</p>
          <p id="error" role="alert"></p>
        </div>

        <div id="gameover" hidden>
          <small>本局结束</small>
          <h2 id="final-score">切开 0 个水果</h2>
          <p id="final-note">炸弹耗尽了你的生命。</p>
          <button id="again">再来一局</button>
        </div>

        <div class="preview">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="skeleton"></canvas>
        </div>

        <div class="bottomline">
          <span id="hint">按住鼠标或触屏划动；方向键移动，空格切割</span>
          <div class="effect-toggles" aria-label="反馈效果">
            <button id="sound-toggle" class="toggle active" aria-pressed="true">声音</button>
            <button id="shake-toggle" class="toggle active" aria-pressed="true">震动</button>
            <button id="stop" class="secondary">停止摄像头</button>
            <button id="reset" class="secondary">重新开始</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>原创手势街机实验 · 暖色黄昏竞技场</span>
      <a href="/">返回手势追踪</a>
    </footer>

    <script type="module" src="/src/fruit/main.ts"></script>
  </body>
</html>
